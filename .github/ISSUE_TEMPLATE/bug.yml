name: Bug report
description: Report an exposure, provider, schema, raw-result, or packaging problem.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include API keys, OAuth tokens, private prompts, or full session
        transcripts. Redact provider request IDs and page content as needed.
  - type: input
    id: pi-version
    attributes:
      label: Pi version
      description: Run `pi --version`.
    validations:
      required: true
  - type: input
    id: package-version
    attributes:
      label: pi-better-web-search version
      description: For example `0.1.0`.
    validations:
      required: true
  - type: dropdown
    id: install-source
    attributes:
      label: Installation source
      options:
        - npm
        - GitHub
        - local checkout
    validations:
      required: true
  - type: input
    id: current-model
    attributes:
      label: Current model
      description: "Provider/model and API, for example openai/gpt-5.1 (openai-responses)."
    validations:
      required: true
  - type: input
    id: available-providers
    attributes:
      label: Available authenticated providers
      description: List providers with a login or API key. Do not include the credentials.
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include the `web_search` arguments, expected behavior, actual behavior, and relevant redacted error text.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or tool result (redacted)
      render: text
  - type: checkboxes
    id: confirm
    attributes:
      label: Checklist
      options:
        - label: I removed API keys, OAuth tokens, and private data.
          required: true
        - label: I am using pi 1.3 or newer.
          required: true
