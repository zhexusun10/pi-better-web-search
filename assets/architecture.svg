<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="920" viewBox="0 0 1280 920" role="img" aria-labelledby="title desc">
  <title id="title">pi-better-web-search: leading search APIs, one agent tool</title>
  <desc id="desc">One web_search tool accepts query and optional urls. Masked terminal login configures Keenable, Exa, Perplexity or DeepSeek without a chat model. Routing uses per-phase manual preference, then configured Keenable, Exa, Perplexity, standalone DeepSeek, then current provider, success cache and native family fallback. Manual preference gets a first probe even after failure or Retry-After. Health cooldowns reorder automatic native model routes before attempt caps, not explicit or standalone priorities. Search and fetch succeed independently, preserving raw data with a 96,000-character output guard. Native model routes require luna, haiku or flash tiers.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#10182e"/><stop offset="1" stop-color="#080d1a"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#829bc3"/></marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; }
      .panel { fill: #141f35; stroke: #30415f; stroke-width: 1.5; }
      .card { fill: #19273f; stroke: #3b5277; stroke-width: 1.2; }
      .h { fill: #f5f8ff; font-size: 23px; font-weight: 700; }
      .t { fill: #d1ddef; font-size: 17px; }
      .m { fill: #a5b7d3; font-size: 15px; }
      .api { fill: #62e5ce; font-size: 20px; font-weight: 700; }
      .code { fill: #d1ddef; font: 15px Consolas, monospace; }
      .arrow { fill: none; stroke: #829bc3; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1280" height="920" rx="24" fill="url(#bg)"/>
  <text x="44" y="51" fill="#62e5ce" font-size="14" font-weight="700" letter-spacing="2">SEARCH FIRST. BUILD BETTER.</text>
  <text x="44" y="108" fill="#ffffff" font-size="44" font-weight="700">pi-better-web-search</text>
  <text x="44" y="145" class="t">Leading search APIs. Native provider fallback. One tool for your agent.</text>

  <rect x="44" y="182" width="334" height="142" rx="16" class="panel"/>
  <text x="66" y="218" class="h">Your pi agent</text>
  <text x="66" y="250" class="t">Keep your conversation model.</text>
  <text x="66" y="280" class="code">web_search({ query?, urls? })</text>
  <text x="66" y="306" class="m">Search, fetch, or both · 1–20 URLs</text>

  <path d="M378 252H424" class="arrow"/>
  <rect x="432" y="182" width="804" height="142" rx="16" class="panel"/>
  <text x="456" y="218" class="h">Capability-aware router</text>
  <text x="456" y="250" class="t">Manual choice → Keenable / Exa / Perplexity / DeepSeek → native</text>
  <text x="456" y="279" class="m">Separate search / fetch choices · current provider → success cache → family order</text>
  <text x="456" y="306" class="m">Native-route cooldowns · 12 search / 6 fetch attempts · 120s per attempt</text>

  <path d="M834 324V350H350V374" class="arrow"/>
  <path d="M834 350H972V374" class="arrow"/>
  <rect x="44" y="382" width="646" height="304" rx="16" fill="#112a2e" stroke="#2d6b63" stroke-width="1.5"/>
  <text x="66" y="419" class="h">Standalone search APIs</text>
  <text x="66" y="446" class="m">No chat model needed · saved key → environment fallback</text>

  <rect x="64" y="465" width="294" height="91" rx="10" class="card"/>
  <text x="82" y="494" class="api">Keenable</text>
  <text x="82" y="519" class="code">Pro search · 10 results</text>
  <text x="82" y="542" class="m">Live GET Fetch</text>
  <rect x="374" y="465" width="294" height="91" rx="10" class="card"/>
  <text x="392" y="494" class="api">Exa</text>
  <text x="392" y="519" class="code">Auto · 10 + highlights</text>
  <text x="392" y="542" class="m">/contents · full page text</text>
  <rect x="64" y="569" width="294" height="91" rx="10" class="card"/>
  <text x="82" y="598" class="api">Perplexity</text>
  <text x="82" y="623" class="code">Standard web · 10 results</text>
  <text x="82" y="646" class="m">Search only · no inference model</text>
  <rect x="374" y="569" width="294" height="91" rx="10" class="card"/>
  <text x="392" y="598" class="api">DeepSeek</text>
  <text x="392" y="623" class="code">Native Search + Fetch</text>
  <text x="392" y="646" class="m">10 results + content</text>

  <rect x="714" y="382" width="522" height="304" rx="16" class="panel"/>
  <text x="738" y="419" class="h">Native provider fallback</text>
  <text x="738" y="446" class="m">Eligible authenticated models · luna / haiku / flash</text>
  <text x="738" y="488" class="t">DeepSeek · Ollama Cloud</text>
  <text x="738" y="522" class="t">Google Gemini · Google Antigravity</text>
  <text x="738" y="556" class="t">OpenAI · Azure OpenAI · OpenAI Codex</text>
  <text x="738" y="590" class="t">GitHub Copilot · OpenCode · xAI</text>
  <text x="738" y="624" class="t">Anthropic Messages</text>
  <text x="738" y="657" class="m">Newest eligible model · protocol-specific auth</text>

  <path d="M350 686V709H972V686" fill="none" stroke="#829bc3" stroke-width="2"/>
  <path d="M640 709V729" class="arrow"/>
  <rect x="44" y="737" width="1192" height="116" rx="16" class="panel"/>
  <text x="66" y="772" class="h">Raw evidence. Successful work stays successful.</text>
  <text x="66" y="803" class="t">Search and fetch complete independently · retry only unresolved URLs · no re-ranking or extra synthesis</text>
  <text x="66" y="831" class="m">96,000-character default guard · structured truncation · actual routes and partial failures visible in the terminal</text>
  <text x="44" y="889" class="m">Masked /pi-better-web-search login · /web-search-provider · /web-search-api · No MCP · No system-prompt changes · MIT</text>
</svg>
