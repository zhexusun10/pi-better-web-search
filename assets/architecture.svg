<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">pi-better-web-search architecture</title>
  <desc id="desc">One web_search tool routes to provider-native search APIs, falls back across authenticated providers, and returns raw provider JSON with a size guard.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#52525b"/>
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .panel { fill: #fafafa; stroke: #e4e4e7; stroke-width: 1.5; }
      .box { fill: #ffffff; stroke: #18181b; stroke-width: 1.6; }
      .accent { fill: #18181b; stroke: #18181b; }
      .dash { fill: none; stroke: #a1a1aa; stroke-width: 1.4; stroke-dasharray: 6 6; }
      .title { font: 700 40px Arial, Helvetica, sans-serif; fill: #111111; }
      .subtitle { font: 400 20px Arial, Helvetica, sans-serif; fill: #52525b; }
      .h { font: 700 18px Arial, Helvetica, sans-serif; fill: #18181b; }
      .t { font: 400 15px Arial, Helvetica, sans-serif; fill: #3f3f46; }
      .muted { font: 400 14px Arial, Helvetica, sans-serif; fill: #71717a; }
      .inv-h { font: 700 18px Arial, Helvetica, sans-serif; fill: #ffffff; }
      .inv-t { font: 400 14px Arial, Helvetica, sans-serif; fill: #e4e4e7; }
      .arrow { stroke: #52525b; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .label { font: 600 13px Arial, Helvetica, sans-serif; fill: #52525b; }
      .footer { font: 400 14px Arial, Helvetica, sans-serif; fill: #71717a; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="640"/>
  <rect class="panel" x="20" y="20" width="1160" height="600" rx="22"/>

  <text class="title" x="56" y="82">pi-better-web-search</text>
  <text class="subtitle" x="56" y="116">one tool · provider-native search · raw results</text>

  <rect class="box" x="56" y="166" width="226" height="136" rx="16"/>
  <text class="h" x="78" y="198">Current pi model</text>
  <text class="t" x="78" y="226">supports search?</text>
  <text class="muted" x="78" y="252">yes → use it first</text>
  <text class="muted" x="78" y="274">no → fallback</text>

  <path class="arrow" d="M 286 234 L 334 234"/>
  <text class="label" x="292" y="222">route</text>

  <rect class="box" x="342" y="166" width="248" height="136" rx="16"/>
  <text class="h" x="364" y="198">Candidate router</text>
  <text class="t" x="364" y="226">current → cached →</text>
  <text class="t" x="364" y="248">family priority</text>
  <text class="muted" x="364" y="274">fingerprint-aware cache</text>

  <path class="arrow" d="M 594 234 L 642 234"/>
  <text class="label" x="600" y="222">try in order</text>

  <text class="h" x="650" y="126">provider adapters</text>
  <rect class="dash" x="642" y="140" width="258" height="318" rx="18"/>

  <rect class="accent" x="654" y="152" width="234" height="52" rx="12"/>
  <text class="inv-h" x="672" y="175">DeepSeek</text>
  <text class="inv-t" x="672" y="194">native search + fetch</text>

  <rect class="box" x="654" y="214" width="234" height="52" rx="12"/>
  <text class="h" x="672" y="237">Ollama Cloud</text>
  <text class="t" x="672" y="256">search + fetch</text>

  <rect class="box" x="654" y="276" width="234" height="52" rx="12"/>
  <text class="h" x="672" y="299">Google Gemini</text>
  <text class="t" x="672" y="318">search + URL context</text>

  <rect class="box" x="654" y="338" width="234" height="52" rx="12"/>
  <text class="h" x="672" y="361">OpenAI / xAI</text>
  <text class="t" x="672" y="380">Responses web search</text>

  <rect class="box" x="654" y="400" width="234" height="52" rx="12"/>
  <text class="h" x="672" y="423">Anthropic</text>
  <text class="t" x="672" y="442">Messages web search</text>

  <path class="arrow" d="M 906 234 L 954 234"/>
  <text class="label" x="912" y="222">raw</text>

  <rect class="box" x="962" y="166" width="178" height="136" rx="16"/>
  <text class="h" x="982" y="198">Tool result</text>
  <text class="t" x="982" y="226">raw JSON</text>
  <text class="muted" x="982" y="252">no cleanup</text>
  <text class="muted" x="982" y="274">64k char guard</text>

  <rect class="panel" x="56" y="492" width="1084" height="94" rx="16"/>
  <text class="h" x="78" y="522">Exposure &amp; memory</text>
  <text class="t" x="78" y="548">Hidden when the current model has no search interface and no compatible provider is authenticated.</text>
  <text class="t" x="78" y="570">urls appears only when a usable provider supports URL analysis. Cache stores provider/model + fingerprint, never keys.</text>

  <text class="footer" x="56" y="610">Pi 1.3+ · Node 22.19+ · MIT · github.com/zhexusun10/pi-better-web-search</text>
</svg>
